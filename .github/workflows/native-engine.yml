name: native-engine

# Builds native-engine/ (the optional Rust N-API addon behind data<T>'s
# .kelompok()+.agregat() and simple .saring() fast paths — see
# BIGDATA_TYPE.md and src/runtime/native-bridge.js) for every platform Gatra
# supports, and commits the resulting gatra-native-engine.<target>.node
# files straight into native-engine/ so a plain `git clone` + `npm install`
# gets native speed with zero Rust toolchain required — same experience as
# any other prebuilt Node native addon (this mirrors what large native npm
# packages, and Node.js's own release infra, do: build once per real
# platform in CI, ship the binary, never ask the end user to compile it).
#
# Linux targets (glibc + musl, x64 + arm64) are cross-compiled from
# ubuntu-latest using `cross` (Docker-based cross toolchains) — that's
# what scripts/build-native.js's author also used locally to seed the
# first four binaries. Windows and macOS are NOT cross-compiled (Windows-
# GNU cross-compiling an N-API addon needs a real libnode.dll that
# standard Node distributions don't ship, and macOS needs Apple's SDK,
# which cross tooling on Linux can't legally provide) — they build
# natively on windows-latest / macos-13 (Intel) / macos-14 (Apple
# Silicon) runners instead, exactly like real projects do it.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'native-engine/**'
      - '.github/workflows/native-engine.yml'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            tag: linux-x64-gnu
            musl: false
          - target: x86_64-unknown-linux-musl
            tag: linux-x64-musl
            musl: true
          - target: aarch64-unknown-linux-gnu
            tag: linux-arm64-gnu
            musl: false
          - target: aarch64-unknown-linux-musl
            tag: linux-arm64-musl
            musl: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        working-directory: native-engine
        env:
          # musl's default target-feature set is fully static, which
          # silently drops cdylib output — opt back into a dynamic build.
          RUSTFLAGS: ${{ matrix.musl && '-C target-feature=-crt-static' || '' }}
        run: cross build --release --target ${{ matrix.target }}
      - name: Rename output
        working-directory: native-engine
        run: cp target/${{ matrix.target }}/release/libgatra_native_engine.so gatra-native-engine.${{ matrix.tag }}.node
      - uses: actions/upload-artifact@v4
        with:
          name: gatra-native-engine.${{ matrix.tag }}.node
          path: native-engine/gatra-native-engine.${{ matrix.tag }}.node

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        working-directory: native-engine
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Rename output
        working-directory: native-engine
        run: copy target\x86_64-pc-windows-msvc\release\gatra_native_engine.dll gatra-native-engine.win32-x64-msvc.node
      - uses: actions/upload-artifact@v4
        with:
          name: gatra-native-engine.win32-x64-msvc.node
          path: native-engine/gatra-native-engine.win32-x64-msvc.node

  macos:
    strategy:
      matrix:
        include:
          - os: macos-13     # Intel runner
            target: x86_64-apple-darwin
            tag: darwin-x64
          - os: macos-14     # Apple Silicon runner
            target: aarch64-apple-darwin
            tag: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: native-engine
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename output
        working-directory: native-engine
        run: cp target/${{ matrix.target }}/release/libgatra_native_engine.dylib gatra-native-engine.${{ matrix.tag }}.node
      - uses: actions/upload-artifact@v4
        with:
          name: gatra-native-engine.${{ matrix.tag }}.node
          path: native-engine/gatra-native-engine.${{ matrix.tag }}.node

  commit:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: native-engine
          pattern: 'gatra-native-engine.*.node'
          merge-multiple: true
      - name: Commit prebuilt binaries
        run: |
          git config user.name "gatra-ci"
          git config user.email "gatra-ci@users.noreply.github.com"
          git add native-engine/gatra-native-engine.*.node
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(native-engine): update prebuilt binaries [ci skip]"
          git push
